<!DOCTYPE html>
<html lang="bn" data-theme="dark" id="gst-root-2026">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Model Test 1.0 - SolveSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0d1117;
            --gradient-bg: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #f0f6fc;
            --accent: #58a6ff;
            --border: rgba(240, 246, 252, 0.1);
        }

        [data-theme="light"] {
            --primary-bg: #ffffff;
            --gradient-bg: linear-gradient(135deg, #f6f8fa 0%, #e6edf3 100%);
            --card-bg: #ffffff;
            --text-main: #1f2328;
            --accent: #0969da;
            --border: #d0d7de;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }

        body {
            background: var(--gradient-bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            transition: 0.3s;
        }

        #wrapper-main { max-width: 900px; margin: 0 auto; }

        #top-nav { display: flex; justify-content: flex-end; gap: 15px; margin-bottom: 30px; }
        
        .btn {
            padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; font-weight: 700; transition: 0.2s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }
        
        #btn-mode { background: var(--card-bg); color: var(--text-main); }
        #btn-download { background: var(--accent); color: white; border: none; }

        #capture-area { 
            padding: 50px 40px; 
            border-radius: 24px; 
            background: var(--gradient-bg);
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        #header-box { text-align: center; margin-bottom: 40px; }
        #brand { font-size: 1.1rem; color: var(--accent); letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
        #main-title { font-size: 2.8rem; margin-top: 10px; font-weight: 800; }

        .test-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .test-row { border-bottom: 1px solid var(--border); transition: 0.3s; }
        .test-cell { padding: 18px 15px; font-size: 1.15rem; }
        .test-name { font-weight: 700; color: var(--accent); }
        .test-date { text-align: right; opacity: 0.8; font-weight: 600; }

        #premium-footer {
            margin-top: 40px; padding: 30px; border-radius: 15px;
            background: rgba(0,0,0,0.1); border-top: 3px solid var(--accent);
        }
        .guide-item { margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px; font-size: 1rem; }
        .dot { color: var(--accent); }
        #slogan { text-align: center; margin-top: 30px; font-size: 1.8rem; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body id="body-main">

    <div id="wrapper-main">
        <nav id="top-nav">
            <button class="btn" id="btn-mode" onclick="toggleTheme()">🌓 থিম পরিবর্তন</button>
            <a href="modeltest-black.png" download="GST_Routine_SolveSphere.png" class="btn" id="btn-download">
                📥 ডাউনলোড রুটিন
            </a>
        </nav>

        <div id="capture-area">
            <header id="header-box">
                <p id="brand" id="brand-text">SolveSphere Presents</p>
                <h1 id="main-title" id="title-text">GST Model Test 1.0</h1>
            </header>

            <table class="test-table" id="table-01">
                <tbody id="routine-body">
                    </tbody>
            </table>

            <footer id="premium-footer">
                <div class="guide-item"><span class="dot">●</span> <p id="guide-1">প্রতিটি মডেল টেস্ট GST স্ট্যান্ডার্ড <strong>৯০ মার্কসের</strong> হবে।</p></div>
                <div class="guide-item"><span class="dot">●</span> <p id="guide-2">অপশনাল সাবজেক্টের পরিবর্তে শিক্ষার্থীরা নিজের পছন্দমতো <strong>বাংলা অথবা ইংরেজি</strong> উত্তর করতে পারবে।</p></div>
                
                <div id="slogan" id="slogan-text">বিজয় এপ্রিল, ইনশাআল্লাহ</div>
            </footer>
        </div>
    </div>

    <script>
        // Auto-generate 10 days sequence starting from March 29, 2026
        const routineBody = document.getElementById('routine-body');
        const startDate = new Date('2026-03-29');
        const months = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];

        for (let i = 1; i <= 10; i++) {
            let currentDate = new Date(startDate);
            currentDate.setDate(startDate.getDate() + (i - 1));
            
            let day = currentDate.getDate();
            let month = months[currentDate.getMonth()];
            let year = currentDate.getFullYear();

            routineBody.innerHTML += `
                <tr class="test-row" id="row-${i}">
                    <td class="test-cell test-name">GST MODEL TEST-0${i < 10 ? i : i}</td>
                    <td class="test-cell test-date">${day} ${month}, ${year}</td>
                </tr>
            `;
        }

        function toggleTheme() {
            const root = document.getElementById('gst-root-2026');
            const current = root.getAttribute('data-theme');
            root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
